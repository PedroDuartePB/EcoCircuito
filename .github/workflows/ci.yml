name: CI — Fase 0 Fundação

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Lint, Typecheck, Migrations & Tests (PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: ecocircuito
          POSTGRES_USER: ecocircuito_migrator
          POSTGRES_PASSWORD: ci_migrator_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ecocircuito_migrator -d ecocircuito && psql -U ecocircuito_migrator -d ecocircuito -tAc 'SELECT PostGIS_Version();'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (Ruff)
        run: ruff check app tests alembic

      - name: Typecheck (Mypy)
        run: mypy app

      - name: Executar migrações Alembic (PostGIS + Schemas)
        env:
          MIGRATION_DATABASE_URL: postgresql+psycopg://ecocircuito_migrator:ci_migrator_password@localhost:5432/ecocircuito
        run: alembic upgrade head

      - name: Executar testes unitários e integração PostGIS
        env:
          TEST_DATABASE_URL: postgresql+psycopg://ecocircuito_migrator:ci_migrator_password@localhost:5432/ecocircuito
        run: pytest -v

  frontend:
    name: Frontend Lint, Typecheck, Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: npm install

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (TypeScript)
        run: npm run typecheck

      - name: Testes (Vitest)
        run: npm test

      - name: Build (Vite)
        run: npm run build

