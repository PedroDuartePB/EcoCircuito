[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecocircuito-backend"
version = "0.1.0"
description = "Backend EcoCircuito MVP — Monólito Modular Clean Architecture com FastAPI e PostgreSQL/PostGIS"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.6,<1.0",
  "uvicorn[standard]>=0.34.0,<1.0",
  "pydantic>=2.11.0,<3.0",
  "pydantic-settings>=2.8.0,<3.0",
  "sqlalchemy>=2.0.37,<2.1",
  "psycopg[binary]>=3.2.10,<3.4",
  "geoalchemy2>=0.17.0,<1.0",
  "alembic>=1.14.1,<2.0",
  "pyjwt>=2.10.1,<3.0",
  "pwdlib[argon2]>=0.2.1,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4,<9.0",
  "httpx>=0.28.1,<1.0",
  "ruff>=0.9.4,<1.0",
  "mypy>=1.14.1,<2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "N", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: testes que exigem PostgreSQL com PostGIS ativo",
]

